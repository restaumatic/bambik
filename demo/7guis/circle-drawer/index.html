<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/haskell.min.js"></script>
    <title>Bambik · 7GUIs · Circle Drawer</title>
    <style>
      body {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
        margin: 16px;
        font-family: Roboto, sans-serif;
      }
      body > .mdc-elevation--z20 { flex: 0 1 480px; min-width: 320px; order: 1; }
      #source-panel { flex: 1 1 480px; min-width: 320px; max-height: 95vh; overflow: auto; order: 2; }
      #source-panel h3 { color: #555; margin: 8px 0; }
      #source-panel pre { background: #f6f8fa; padding: 12px; border-radius: 6px; font-size: 12.5px; margin: 0; }
      #source-panel p { font-size: 14px; }
    </style>
    <script type="module" src="bundle.js"></script>
  </head>
  <body>
    <section id="source-panel">
      <h3>Source — Main.purs</h3>
      <p>
        <a href="https://eugenkiss.github.io/7guis/tasks/#circle">Task description on 7GUIs</a>
        · <a href="../">all 7GUIs tasks</a>
      </p>
      <pre><code id="src" class="language-haskell">loading…</code></pre>
    </section>
    <script>
      fetch("Main.purs").then(r => r.text()).then(src => {
        const el = document.getElementById("src");
        el.textContent = src;
        if (window.hljs) hljs.highlightElement(el);
      });
    </script>
  </body>
</html>
